<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>말해U 수집</title>
<style>
  :root{
    /* 라이트(낮) — 현행 톤 유지, 글씨·테두리만 더 또렷하게 */
    --bg:#f4f1ea; --ink:#15130f; --sub:#5c5446;
    --line:#cbc4b2; --card:#fffdf8;
    --jn:#0a5f53; --jb:#8a4f17; --accent:#0a5f53;
    --rec:#b5311f; --rec-on:#e0402c; --go:#15130f;
    --warn:#b5311f;
    --logo-pad:#ffffff;
  }
  body[data-theme="dark"]{
    /* 밤 — 풀블랙 대신 짙은 회갈색, 밝은 글씨(적당 고대비, 눈부심 억제) */
    --bg:#1e1c19; --ink:#f2efe8; --sub:#b3ac9e;
    --line:#403b34; --card:#2a2723;
    --jn:#4fc4b2; --jb:#e0a766; --accent:#4fc4b2;
    --rec:#e0533f; --rec-on:#f06a55; --go:#3a352f;
    --warn:#e0a766;
    --logo-pad:#ffffff;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  button{font-family:inherit; color:inherit;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    display:flex; flex-direction:column; min-height:100dvh;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }
  .page{display:none; flex:1; flex-direction:column;}
  .page.on{display:flex;}
  .wrap{max-width:620px; margin:0 auto; width:100%; padding:24px 22px;}

  h1{font-size:25px; margin:6px 0 4px; letter-spacing:-.5px;}
  .lead{color:var(--sub); margin:0 0 22px; font-size:15px;}
  /* 로고 */
  .logo-hero{display:flex; flex-direction:column; align-items:center; gap:10px; margin:4px 0 18px;}
  .logo-hero img{width:96px; height:96px; border-radius:22px; background:var(--logo-pad); padding:6px; box-shadow:0 2px 10px rgba(0,0,0,.12);}
  .logo-mini{width:38px; height:38px; border-radius:10px; background:var(--logo-pad); padding:3px; flex:none;}

  /* 메타 */
  .field{margin-bottom:20px;}
  .field label{display:block; font-size:15px; color:var(--sub); margin-bottom:8px; font-weight:600;}
  .opts{display:flex; flex-wrap:wrap; gap:8px;}
  .opt{
    flex:1 1 auto; min-width:64px; text-align:center; padding:14px 10px;
    border:2px solid var(--line); border-radius:14px; background:var(--card);
    font-size:16px; cursor:pointer; font-weight:600; transition:.12s;
  }
  .opt[aria-pressed="true"]{border-color:var(--ink); background:var(--ink); color:#fff;}
  .bigbtn{width:100%; padding:18px; border:none; border-radius:16px; background:var(--go); color:#fff; font-size:19px; font-weight:700; cursor:pointer; margin-top:8px;}
  .bigbtn:disabled{opacity:.35;}
  .sel{width:100%; padding:14px; border:2px solid var(--line); border-radius:14px; background:var(--card); font-size:16px; font-weight:600; color:var(--ink); appearance:none;}
  .yearrow{display:flex; gap:8px;}
  .yearrow .sel{flex:1;}
  .txt{flex:1; padding:14px; border:2px solid var(--line); border-radius:14px; background:var(--card); font-size:16px; font-weight:600; color:var(--ink); min-width:0;}
  .consent{background:var(--card); border:2px solid var(--line); border-radius:16px; padding:16px; margin:6px 0 16px;}
  .chk{display:flex; gap:11px; align-items:flex-start; cursor:pointer;}
  .chk input{width:24px; height:24px; flex:none; margin-top:2px; accent-color:var(--accent);}
  .chk span{font-size:13.5px; line-height:1.55; color:var(--sub);}
  .chk strong{color:var(--ink); font-weight:700;}
  .consent-link{display:inline-block; margin-top:12px; padding-left:35px; font-size:14px; color:var(--accent); font-weight:700; text-decoration:none;}

  /* 섹션 선택 */
  .resume{
    background:var(--card); border:2px solid var(--accent); border-radius:16px;
    padding:16px; margin-bottom:20px; display:flex; align-items:center; gap:14px; color:var(--ink);
  }
  .resume .txt{flex:1;}
  .resume .t1{font-weight:700; font-size:16px;}
  .resume .t2{font-size:13px; color:var(--sub); margin-top:2px;}
  .resume button{padding:12px 18px; border:none; border-radius:12px; background:var(--accent); color:#fff; font-weight:700; font-size:15px; cursor:pointer;}
  .seclist{display:grid; gap:12px;}
  .seccard{
    border:2px solid var(--line); border-radius:16px; background:var(--card);
    padding:16px 18px; cursor:pointer; text-align:left; color:var(--ink);
    font-family:inherit;
  }
  .seccard:active{transform:scale(.99);}
  .sechead{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:10px;}
  .secname{font-size:17px; font-weight:700; color:var(--ink);}
  .secnum{font-size:14px; color:var(--sub); font-variant-numeric:tabular-nums;}
  .secbar{height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
  .secbar i{display:block; height:100%; background:var(--accent); width:0; transition:width .3s;}
  .seccard.done{border-color:var(--accent);}
  .seccard.done .secname::after{content:" ✓"; color:var(--accent);}

  /* 미전송 알림 */
  .pend{
    background:var(--card); border:2px solid var(--warn); border-radius:16px;
    padding:14px 16px; margin-bottom:18px; display:flex; align-items:center; gap:12px;
  }
  .pend .t1{flex:1; font-size:14px; font-weight:700; color:var(--ink); line-height:1.45;}
  .pend .t1 b{color:var(--warn);}
  .pend button{padding:11px 16px; border:none; border-radius:12px; background:var(--warn); color:#fff; font-weight:700; font-size:14px; cursor:pointer; flex:none;}
  .pend button:disabled{opacity:.5;}

  /* 자유 발화 진입 카드 (섹션 목록 맨 아래) */
  .divider{display:flex; align-items:center; gap:12px; margin:26px 0 14px; color:var(--sub); font-size:12.5px; font-weight:700;}
  .divider::before,.divider::after{content:""; flex:1; height:1px; background:var(--line);}
  .seccard.free{border-color:var(--accent);}
  .seccard.free .sechead{margin-bottom:0;}
  .secsub{font-size:13px; color:var(--sub); margin-top:6px;}

  /* 녹음 */
  .topbar{display:flex; align-items:center; gap:12px; padding:14px 18px; border-bottom:1px solid var(--line); font-size:13px; color:var(--sub);}
  .who{font-weight:700; color:var(--ink);}
  .prog{flex:1; height:8px; background:var(--line); border-radius:99px; overflow:hidden;}
  .prog i{display:block; height:100%; background:var(--accent); width:0;}
  .stage{flex:1; display:flex; flex-direction:column; justify-content:center;}
  .idtag{font-size:13px; color:var(--sub); letter-spacing:1px; margin-bottom:14px;}
  .std{font-size:34px; font-weight:800; line-height:1.3; letter-spacing:-1px; margin-bottom:22px;}
  .hint{font-size:13px; color:var(--sub); margin-bottom:12px;}
  .dia{border-top:1px dashed var(--line); padding-top:16px;}
  .dline{display:flex; gap:10px; align-items:baseline; font-size:22px; font-weight:600;}
  .dline + .dline{margin-top:12px;}
  .dline.sub{font-size:18px; font-weight:500; color:var(--sub);}
  .dline.sub .badge{opacity:.72;}
  .badge{font-size:12px; font-weight:800; padding:3px 9px; border-radius:8px; color:#fff; flex:none; white-space:nowrap;}
  .badge.jn{background:var(--jn);} .badge.jb{background:var(--jb);}

  .controls{padding:18px 22px 24px; max-width:620px; margin:0 auto; width:100%;}
  .recbtn{width:100%; padding:24px; border:none; border-radius:20px; background:var(--rec); color:#fff; font-size:22px; font-weight:800; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:12px;}
  .recbtn.recording{background:var(--rec-on); animation:pulse 1.1s infinite;}
  @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(231,76,60,.5);}50%{box-shadow:0 0 0 16px rgba(231,76,60,0);}}
  .dot{width:16px; height:16px; border-radius:50%; background:#fff;}
  .recbtn.recording .dot{border-radius:4px;}
  .timer{text-align:center; font-size:15px; color:var(--sub); margin-top:8px; min-height:20px; font-variant-numeric:tabular-nums;}
  .subrow{display:flex; gap:10px; margin-top:12px;}
  .subbtn{flex:1; padding:14px; border:2px solid var(--line); border-radius:14px; background:var(--card); font-size:16px; font-weight:700; cursor:pointer; color:var(--ink);}
  .subbtn:disabled{opacity:.35;}
  .saved{font-size:13px; color:var(--accent); font-weight:700; text-align:center; margin-top:10px; min-height:18px;}
  .navrow{display:flex; gap:10px; margin-top:8px;}
  .navbtn{flex:1; padding:15px; border:none; border-radius:14px; font-size:16px; font-weight:700; cursor:pointer;}
  .prev{background:var(--line); color:var(--ink);}
  .next{background:var(--go); color:#fff;}
  .backbtn{width:100%; padding:14px; margin-top:10px; border:2px solid var(--line); border-radius:14px; background:transparent; font-size:15px; font-weight:700; color:var(--sub); cursor:pointer;}

  /* ════ 자유 발화 타일 그리드 ════
     타일 최소폭이 뷰포트에 비례(19vw)하고 68~104px로 물려 있어,
     auto-fill이 좁은 화면에선 4단, .wrap 상한(내부 576px)에선 5단을 잡는다.
     행은 개수만큼 자동으로 아래로 늘어난다. 미디어쿼리 불필요.          */
  .freehint{font-size:13.5px; color:var(--sub); line-height:1.65; margin:0 0 18px;}
  .tiles{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(clamp(68px, 19vw, 104px), 1fr));
    gap:10px;
  }
  .tile{
    aspect-ratio:1; border-radius:18px; border:2px solid var(--line);
    background:var(--card); color:var(--ink); cursor:pointer;
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
    font-family:inherit; padding:4px; transition:.12s; overflow:hidden;
  }
  .tile:active{transform:scale(.96);}
  .tile .n{font-size:11px; color:var(--sub); font-weight:700; line-height:1;}
  .tile .len{font-size:clamp(14px,4vw,19px); font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.5px; line-height:1.1;}
  .tile .dot2{width:5px; height:5px; border-radius:50%; background:var(--accent);}
  .tile.pending{border-style:dashed;}
  .tile.pending .dot2{background:var(--sub); opacity:.6;}
  .tile.add{border:2px dashed var(--line); background:transparent;}
  .tile.add .plus{font-size:clamp(26px,8vw,38px); font-weight:300; line-height:1; color:var(--accent);}
  .tile.add .cap{font-size:11px; font-weight:700; color:var(--sub);}
  .tile.recording{border:2px solid var(--rec-on); background:var(--rec); color:#fff; animation:pulse 1.1s infinite;}
  .tile.recording .sq{width:clamp(16px,5vw,22px); aspect-ratio:1; border-radius:5px; background:#fff;}
  .tile.recording .cap{color:#fff; font-size:clamp(13px,3.6vw,16px); font-weight:800; font-variant-numeric:tabular-nums;}
</style>
</head>
<body>

<!-- 0. 프로필 허브 -->
<section class="page on" id="pgHub"><div class="wrap">
  <div class="logo-hero"><img src="l2u_logo.png" alt="말해U"><h1 style="margin:0;">말해U 발화 수집</h1></div>
  <p class="lead">녹음하실 분을 고르거나, 새로 추가하세요.</p>

  <button class="bigbtn" id="addProfile" style="margin-top:18px;">＋ 새 화자 추가</button>
</div></section>

<!-- 1. 메타 -->
<section class="page" id="pgMeta"><div class="wrap">
  <div class="logo-hero"><img src="l2u_logo.png" alt="말해U"><h1 style="margin:0;">말해U 발화 수집</h1></div>
  <p class="lead">화자 정보를 한 번만 입력해 주세요.</p>

  <div class="consent">
    <label class="chk">
      <input type="checkbox" id="agree">
      <span><strong>다음을 눌러 진행하면, 음성(녹음)·성별·출생연도·출생지역 및 녹음 환경 정보가 수집·이용되는 것에 동의합니다.</strong>
      수집된 음성은 비식별 처리되며, 방언 음성 인식 데이터 구축 목적으로만 이용됩니다.
      원하지 않으시면 수집에 응하지 않으셔도 됩니다.</span>
    </label>
    <a class="consent-link" href="L2U_consent.html" target="_blank" rel="noopener">수집·보관·이용 상세 안내 보기 ↗</a>
  </div>

  <button class="bigbtn" id="toSections" disabled>다음</button>
</div></section>

<!-- 2. 섹션 선택 -->
<section class="page" id="pgSec"><div class="wrap">
  <h1>섹션 선택</h1>
  <p class="lead" id="secLead"></p>
  <div id="pendBox"></div>

  <button class="backbtn" id="toHub" style="margin-top:18px;">← 화자 선택으로</button>
</div></section>

<!-- 3. 낭독 녹음 -->
<section class="page" id="pgRec">
  <div class="topbar">
    <img src="l2u_logo.png" alt="" class="logo-mini">
    <span class="who" id="who"></span>
    <span id="secName"></span>
    <div class="prog"><i id="progbar"></i></div>

    <div class="idtag" id="idtag"></div>

    <div class="subrow">
      <button class="subbtn" id="play" disabled>▶ 들어보기</button>
      <button class="subbtn" id="redo" disabled>↻ 다시 녹음</button>
    </div>
    <div class="saved" id="saved"></div>
    <div class="navrow">
      <button class="navbtn prev" id="prev">← 이전</button>
      <button class="navbtn next" id="next">다음 →</button>

<!-- 4. 자유 발화 -->
<section class="page" id="pgFree">
  <div class="topbar">
    <img src="l2u_logo.png" alt="" class="logo-mini">
    <span class="who" id="freeWho"></span>
    <span>자유 발화</span>
    <span style="margin-left:auto;" id="freeNum">0개</span>
  </div>
  <div class="wrap stage" style="justify-content:flex-start;">
    <p class="freehint">
      정해진 문장 없이 편하게 이야기해 주세요.<br>
      ＋ 를 눌러 시작하고, 다 말씀하시면 다시 눌러 멈추면 됩니다.<br>
      한 번에 최대 <b>3분</b>까지 녹음되고, 3분이 되면 자동으로 멈춥니다.
    </p>
    <div class="tiles" id="freeTiles"></div>
    <div class="saved" id="freeMsg"></div>
  </div>
  <div class="controls">
    <button class="backbtn" id="toSecFromFree" style="margin-top:0;">■ 섹션 선택으로 (자동 저장)</button>
  </div>
</section>

<script>
/* ════ 테마: 시간대 자동 (밤 19시~07시 다크) ════ */
function applyAutoTheme(){
  const h=new Date().getHours();
  const dark = (h>=19 || h<7);
  document.body.setAttribute('data-theme', dark?'dark':'light');
}
applyAutoTheme();
setInterval(applyAutoTheme, 10*60*1000);   // 10분마다 시간대 재확인(경계 넘어가면 자동 전환)

/* ════ 대본 데이터 ════
   같은 레포의 script.tsv 에서 로드 (id,sec,std,jn,jb).
   대본 수정 시 script.tsv만 다시 올리면 됨 — HTML 불변.            */
let SCRIPT = [];
let SECTIONS = [];
const SCRIPT_URL = 'script.tsv';

async function loadScript(){
  const r = await fetch(SCRIPT_URL, {cache:'no-store'});
  const text = await r.text();
  const lines = text.split(/\r?\n/).filter(l=>l.trim());
  const head = lines.shift().split('\t');           // id sec std jn jb
  SCRIPT = lines.map(l=>{
    const c = l.split('\t');
    return {id:c[0], sec:c[1], std:c[2], jn:c[3], jb:c[4]};
  });
  // 섹션 순서: TSV 등장 순서대로 유니크
  SECTIONS = [...new Set(SCRIPT.map(x=>x.sec))];
}

/* ════ 상태 / 저장 ════ */
let meta = {regionCode:null, region:null, sex:null, birthYear:null};
let speakerId = null;
let curPid = null;                      // 현재 프로필 일련번호
let curSec = null, idx = 0;
const takes = {};                       // id -> {blob,url}  (메모리 캐시. 원본은 IndexedDB)
const REGION_NAME = {'061':'전남','062':'광주','063':'전북','099':'기타'};
const FREE_SEC = '자유발화';            // GAS 폴더 분기 키 — 값 바꾸면 GAS도 같이 바꿔야 함
const FREE_MAX = 180;                   // 자유 발화 1건 상한(초). WAV 무압축 기준 안전선
const K_PROFILES = 'l2u_profiles_v1';   // 프로필 목록
const kDone = pid => `l2u_done_${pid}`; // 프로필별 낭독 진행률
const kLast = pid => `l2u_last_${pid}`; // 프로필별 마지막 위치
const kFree = pid => `l2u_free_${pid}`; // 프로필별 자유 발화 목록 [{id,dur,up}]

/* ════ IndexedDB — 업로드 전 WAV 영속 보관 ════
   메모리(takes)만 쓰면 탭이 닫히거나 업로드가 실패했을 때 원본이 사라진다.
   녹음 즉시 여기에 넣고, 서버가 저장을 확인(ok:true)한 뒤에만 지운다.
   권한 프롬프트 없음. localStorage(문자열 5MB)와 달리 Blob을 그대로 담는다. */
const DB_NAME='l2u_audio', DB_STORE='takes';
let _db=null;
function idb(){
  if(_db) return Promise.resolve(_db);
  return new Promise((res,rej)=>{
    const rq=indexedDB.open(DB_NAME,1);
    rq.onupgradeneeded=()=>{
      const db=rq.result;
      if(!db.objectStoreNames.contains(DB_STORE)){
        const os=db.createObjectStore(DB_STORE,{keyPath:'key'});
        os.createIndex('pid','pid',{unique:false});   // 화자별 조회용
      }
    };
    rq.onsuccess=()=>{ _db=rq.result; res(_db); };
    rq.onerror=()=>rej(rq.error);
  });
}
const idbKey=(pid,id)=>`${pid}/${id}`;

async function idbPut(pid,id,blob){
  try{
    const db=await idb();
    await new Promise((res,rej)=>{
      const tx=db.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).put({key:idbKey(pid,id), pid, id, blob, ts:Date.now()});
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }catch(e){ /* 영속 저장 실패해도 메모리 녹음은 그대로 살아 있음 */ }
}
async function idbDel(pid,id){
  try{
    const db=await idb();
    await new Promise((res,rej)=>{
      const tx=db.transaction(DB_STORE,'readwrite');
      tx.objectStore(DB_STORE).delete(idbKey(pid,id));
      tx.oncomplete=res; tx.onerror=()=>rej(tx.error);
    });
  }catch(e){}
}
async function idbByPid(pid){
  try{
    const db=await idb();
    return await new Promise((res,rej)=>{
      const tx=db.transaction(DB_STORE,'readonly');
      const rq=tx.objectStore(DB_STORE).index('pid').getAll(pid);
      rq.onsuccess=()=>res(rq.result||[]);
      rq.onerror=()=>rej(rq.error);
    });
  }catch(e){ return []; }
}

/* 현재 화자의 미업로드 녹음을 메모리로 복구 */
async function restoreTakes(){
  if(curPid==null) return;
  const rows=await idbByPid(curPid);
  rows.forEach(r=>{
    if(takes[r.id]) return;
    takes[r.id]={blob:r.blob, url:URL.createObjectURL(r.blob)};
  });
}
function clearTakes(){
  Object.keys(takes).forEach(k=>{
    if(takes[k] && takes[k].url) URL.revokeObjectURL(takes[k].url);
    delete takes[k];
  });
}

/* 방언 예시 노출 순서: 전북(063) → 전북 예시 먼저 / 그 외(광주·전남·기타) → 광주·전남 예시 먼저.
   예시 원본은 jn(광주·전남 공용)·jb(전북) 2종이며, 항상 둘 다 노출한다.            */

/* ════ 녹음 엔진 (Web Audio → WAV, iOS Safari 대응) ════
   - AudioContext/스트림은 첫 녹음 때 한 번만 생성해 재사용
   - iOS는 사용자 탭 안에서 ctx.resume() + getUserMedia를 해야 마이크가 묵음이 안 됨
   - raw PCM → WAV(무손실). 안드·iOS 동일 경로(품질 동일).
   - 낭독/자유 발화가 같은 엔진을 공유하되, 정지 처리만 각자 담당.        */
let audioCtx=null, stream=null, src=null, proc=null;
let recording=false, chunks=[], sr=44100, tStart=0, tInt;
let micReady=false;

async function ensureMic(){
  if(micReady) return true;
  // AudioContext: iOS는 webkit 접두 + 탭 안에서 생성/resume 해야 함
  audioCtx = audioCtx || new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended'){ try{ await audioCtx.resume(); }catch(e){} }
  try{
    stream = await navigator.mediaDevices.getUserMedia({audio:{
      noiseSuppression:false, echoCancellation:false, autoGainControl:false,
      channelCount:1
    }});
  }catch(e){
    alert('마이크 권한이 필요합니다. 사파리 주소창 왼쪽 「ㄱㄱ」 → 마이크 허용 후 다시 시도해 주세요.');
    return false;
  }
  sr = audioCtx.sampleRate;                  // iOS는 기기값(보통 48000) 사용
  src = audioCtx.createMediaStreamSource(stream);
  proc = audioCtx.createScriptProcessor(4096,1,1);
  proc.onaudioprocess = e=>{
    if(!recording) return;
    chunks.push(new Float32Array(e.inputBuffer.getChannelData(0)));
  };
  src.connect(proc);
  proc.connect(audioCtx.destination);        // iOS는 destination 연결돼야 onaudioprocess 발화
  micReady=true;
  return true;
}

/* 탭 핸들러 동기 흐름 안에서 resume + 마이크 확보 (iOS 필수) */
async function armMic(){
  if(audioCtx && audioCtx.state==='suspended'){ try{ await audioCtx.resume(); }catch(e){} }
  const ok = await ensureMic();
  if(!ok) return false;
  if(audioCtx.state==='suspended'){ try{ await audioCtx.resume(); }catch(e){} }
  return true;
}

async function startRec(){
  if(!(await armMic())) return;
  chunks=[];
  recording=true; tStart=Date.now();
  tInt=setInterval(()=>document.getElementById('timer').textContent=((Date.now()-tStart)/1000).toFixed(1)+'초',100);
  const b=document.getElementById('recbtn'); b.classList.add('recording'); document.getElementById('reclabel').textContent='■ 정지';
}

function stopRec(){
  recording=false; clearInterval(tInt);
  // context/stream은 닫지 않고 재사용 (다음 문장 녹음 빠르게, iOS 재요청 방지)
  const flat = flatten(chunks);
  if(flat.length===0){
    resetRecBtn();
    document.getElementById('saved').textContent='⚠ 소리가 녹음되지 않았어요. 다시 시도해 주세요.';
    return;
  }
  const blob=encodeWAV(flat,sr); const it=secItems(curSec)[idx];
  if(takes[it.id] && takes[it.id].url) URL.revokeObjectURL(takes[it.id].url);
  takes[it.id]={blob,url:URL.createObjectURL(blob)};
  idbPut(curPid, it.id, blob);               // 원본 영속 보관
  resetRecBtn();
  document.getElementById('play').disabled=false; document.getElementById('redo').disabled=false;
  document.getElementById('saved').textContent='✓ 녹음됨';
  persist();
}
function resetRecBtn(){ const b=document.getElementById('recbtn'); b.classList.remove('recording'); document.getElementById('reclabel').textContent='녹음'; }
document.getElementById('recbtn').addEventListener('click',()=> recording?stopRec():startRec());
document.getElementById('play').addEventListener('click',()=>{
  const t=takes[secItems(curSec)[idx].id];
  if(t){ const a=new Audio(t.url); a.play().catch(()=>alert('재생할 수 없습니다.')); }
});
document.getElementById('redo').addEventListener('click',()=>{
  const it=secItems(curSec)[idx];
  if(takes[it.id]){ if(takes[it.id].url) URL.revokeObjectURL(takes[it.id].url); delete takes[it.id]; }
  idbDel(curPid, it.id);
  render();
});

/* WAV 인코딩 */
function flatten(cs){let n=cs.reduce((a,c)=>a+c.length,0),o=new Float32Array(n),p=0;for(const c of cs){o.set(c,p);p+=c.length;}return o;}
function encodeWAV(s,rate){const b=new ArrayBuffer(44+s.length*2),v=new DataView(b);const w=(o,t)=>{for(let i=0;i<t.length;i++)v.setUint8(o+i,t.charCodeAt(i));};
  w(0,'RIFF');v.setUint32(4,36+s.length*2,true);w(8,'WAVE');w(12,'fmt ');v.setUint32(16,16,true);v.setUint16(20,1,true);v.setUint16(22,1,true);
  v.setUint32(24,rate,true);v.setUint32(28,rate*2,true);v.setUint16(32,2,true);v.setUint16(34,16,true);w(36,'data');v.setUint32(40,s.length*2,true);
  let o=44;for(let i=0;i<s.length;i++,o+=2){let x=Math.max(-1,Math.min(1,s[i]));v.setInt16(o,x<0?x*0x8000:x*0x7FFF,true);}return new Blob([v],{type:'audio/wav'});}

/* ════ 자유 발화 ════ */
let freeTimer=null;

function showFree(){
  document.getElementById('freeWho').textContent=`${regionLabel()}·${meta.sex}·${meta.birthYear}`;
  document.getElementById('freeMsg').textContent='';
  go('pgFree'); drawTiles();
}

function drawTiles(){
  const box=document.getElementById('freeTiles');
  const list=freeList();
  box.innerHTML='';
  list.forEach((f,i)=>{
    const playable = !!takes[f.id];
    const b=document.createElement('button');
    b.className='tile'+(f.up?'':' pending');
    b.innerHTML=`<span class="n">${i+1}</span><span class="len">${fmtDur(f.dur)}</span><span class="dot2"></span>`;
    b.addEventListener('click',()=>{
      if(recording) return;
      if(playable){ const a=new Audio(takes[f.id].url); a.play().catch(()=>{}); }
      else setFreeMsg(f.up?'✓ 업로드 완료된 녹음이에요':'업로드 대기 중이에요');
    });
    box.appendChild(b);
  });
  const add=document.createElement('button');
  add.className='tile add'+(recording?' recording':'');
  add.id='addTile';
  add.innerHTML = recording
    ? '<span class="sq"></span><span class="cap">0:00</span>'
    : '<span class="plus">＋</span><span class="cap">추가</span>';
  add.addEventListener('click',()=> recording?stopFree():startFree());
  box.appendChild(add);
  document.getElementById('freeNum').textContent=list.length+'개';
}
function setFreeMsg(t){ document.getElementById('freeMsg').textContent=t; }

async function startFree(){
  if(!(await armMic())) return;
  chunks=[]; recording=true; tStart=Date.now();
  setFreeMsg('');
  drawTiles();
  freeTimer=setInterval(()=>{
    const s=Math.floor((Date.now()-tStart)/1000);
    if(s>=FREE_MAX){ stopFree(); setFreeMsg('3분이 되어 자동으로 멈췄어요. 이어서 추가하실 수 있어요.'); return; }
    const cap=document.querySelector('#freeTiles .tile.recording .cap');
    if(cap) cap.textContent=fmtDur(s);
  },250);
}

function stopFree(){
  if(!recording) return;
  recording=false; clearInterval(freeTimer);
  const flat=flatten(chunks);
  if(flat.length===0){ drawTiles(); setFreeMsg('⚠ 소리가 녹음되지 않았어요. 다시 시도해 주세요.'); return; }
  const dur=Math.round(flat.length/sr);
  const list=freeList();
  // 연번은 화자별 누적(삭제 없음) — 파일명에 타임스탬프가 붙어 중복 위험 없음
  const id=`FREE_${String(list.length+1).padStart(3,'0')}`;
  const blob=encodeWAV(flat,sr);
  takes[id]={blob, url:URL.createObjectURL(blob)};
  idbPut(curPid, id, blob);                  // 원본 영속 보관
  list.push({id, dur, up:false});
  saveFreeList(list);
  drawTiles();
  setFreeMsg('✓ 저장됨 · 섹션 선택으로 나가면 업로드됩니다');
}

document.getElementById('toSecFromFree').addEventListener('click',()=>{
  if(recording) stopFree();
  uploadPending().then(showSections);
});

/* ════ 업로드 (GAS → Drive) ════ */
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwyEZBn7g1h098IQSNqoph09F1laGDHT-1A3XJrjBTi9qSrXwKcophe0H5Y-xPNFR7r/exec';

function blobToBase64(blob){
  return new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(',')[1]);   // data:...;base64, 뒤만
    r.onerror=rej; r.readAsDataURL(blob);
  });
}

async function uploadOne(id){
  const t=takes[id]; if(!t) return false;
  const it = SCRIPT.find(x=>x.id===id);
  const sec = it ? it.sec : (id.startsWith('FREE_') ? FREE_SEC : '');
  const b64 = await blobToBase64(t.blob);
  const m = {
    regionCode: meta.regionCode, sex: meta.sex, birthYear: meta.birthYear,
    speakerId, id, sec, consent:true
  };
  const body = new URLSearchParams();
  body.append('file', b64);
  body.append('meta', JSON.stringify(m));
  // GAS 웹앱(ANYONE_ANONYMOUS)은 CORS 헤더를 반환하므로 응답을 읽을 수 있다.
  // URLSearchParams 본문 = simple request → OPTIONS 프리플라이트 없음.
  // ※ headers를 추가하거나 Content-Type을 application/json으로 바꾸면
  //   프리플라이트가 발생하고 GAS는 doOptions를 지원하지 않아 전부 실패한다.
  const res = await fetch(GAS_URL, { method:'POST', body });
  if(!res.ok) return false;
  const data = await res.json();             // 오류 페이지(HTML)면 throw → 상위 catch
  return data && data.ok === true;           // 서버가 저장 성공을 확인한 경우만 true
}

let uploading=false;
async function uploadPending(){
  if(uploading) return;                      // 중복 실행 방지(뒤로가기 연타 등)
  if(GAS_URL.startsWith('PASTE_')) return;   // 아직 URL 미설정이면 스킵(로컬 테스트)
  uploading=true;
  const pid=curPid;
  try{
    for(const id of Object.keys(takes)){
      try{
        const ok=await uploadOne(id);
        if(!ok) continue;                    // 실패분은 takes·IndexedDB에 남겨 재시도
        if(id.startsWith('FREE_')){          // 자유 발화: 목록에 업로드 완료 표시
          const list=freeList(); const f=list.find(x=>x.id===id);
          if(f){ f.up=true; saveFreeList(list); }
        }
        await idbDel(pid, id);               // 서버 저장 확인 후에만 영속본 삭제
        if(takes[id]){ if(takes[id].url) URL.revokeObjectURL(takes[id].url); delete takes[id]; }
      }catch(e){ /* 개별 실패는 무시하고 다음 건으로 */ }
    }
  } finally { uploading=false; }
  persist();
}

/* ════ 부팅: 대본 로드 → 프로필 허브 ════ */
(async function boot(){
  // 저장 공간 영속 승격 요청(프롬프트 없음, 거부돼도 정상 동작)
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persist(); }catch(e){}
  try{
    await loadScript();                 // script.tsv 먼저 읽어 SCRIPT/SECTIONS 채움
  }catch(e){
    alert('대본(script.tsv)을 불러오지 못했습니다. 파일이 올라가 있는지 확인하세요.');
    return;
  }
  // 등록 화자 있으면 허브, 없으면(첫 실행) 바로 온보딩
  if(loadProfiles().length>0){ showHub(); }
  else { clearMetaForm(); go('pgMeta'); }
})();
</script>
